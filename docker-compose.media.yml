# Overlay for the DEDICATED media droplet (SCRUM-291).
#
# The media droplet runs ONLY media-server. It has no local `db` service —
# media-server reaches Postgres on the app droplet over the private VPC via
# DATABASE_URL in its own .env (written from the MEDIA_SERVER_ENV_FILE secret).
# So this overlay clears the base's `depends_on: db`, which would otherwise make
# `up media-server` spin up a useless local Postgres on the media droplet and
# block the deploy on its health.
#
# Deploy (see .github/workflows/deploy-media.yml):
#   docker compose -f docker-compose.yml -f docker-compose.media.yml \
#     up -d --build --wait --wait-timeout 180 media-server
#
# Everything else about media-server (build, ports, healthcheck, journald
# logging, HLS volume) is inherited from docker-compose.yml so the two never
# drift. `!reset` is a Compose merge tag that clears a value during override
# (requires Compose v2.24+; the droplets run a newer Docker/Compose).
name: hypulse

services:
  media-server:
    depends_on: !reset {}
