# Local development only — NOT for production.
# Exposes the DB port to the host so developers can run the server locally.
#
# WHY this is not named docker-compose.override.yml: Compose auto-loads an
# "override" file on every `docker compose up` with no -f flag, including on
# the production droplet (it is git-tracked and lands there via deploy). That
# silently re-published 5432 to the internet (SCRUM-292). Renamed so it is
# opt-in only: load it explicitly. `npm run docker:up` / `docker:rebuild`
# already pass `-f docker-compose.yml -f docker-compose.local.yml` for you.
services:
  db:
    # WHY no `ports` here: the base compose now publishes 5432 via
    # `${DB_BIND_IP:-127.0.0.1}:5432:5432`. Unset locally, that binds
    # 127.0.0.1:5432 — exactly what a dev needs to reach the DB from the host,
    # and safer than the old 0.0.0.0 publish. A `ports` entry here would be
    # concatenated with the base one and collide on 5432 (SCRUM-291).
    # WHY override the driver: the base compose uses journald so PROD logs
    # survive `--build` (SCRUM-318). journald needs systemd on the host, which
    # Docker Desktop lacks, and it would break `docker compose logs` for devs.
    # Locally we want the default json-file driver with rotation so logs are
    # readable via `docker compose logs` without filling the dev disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app-server:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  media-server:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Behind `profiles: [studio]`, so only started on demand — but when a dev does
  # run it on Docker Desktop the base journald driver would fail (no systemd).
  prisma-studio:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
